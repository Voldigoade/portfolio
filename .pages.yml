media:
  input: public/images/writing
  output: /images/writing
  rename: safe
  categories:
    - image
  extensions:
    - png
    - jpg
    - jpeg
    - webp
    - avif

content:
  - name: writing
    label: Writing
    type: collection
    path: content/writing
    format: yaml-frontmatter
    subfolders: false
    filename: "{fields.slug}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: Use lowercase letters, numbers and single hyphens.
      - name: summary
        label: Summary
        type: text
        required: true
      - name: type
        label: Type
        type: select
        required: true
        options:
          values: [Article, Write-up, Research, Note, Project Log]
      - name: tags
        label: Tags
        type: string
        list: true
        required: true
      - name: publishedAt
        label: Published Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updatedAt
        label: Updated Date
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: draft
        label: Draft
        type: boolean
        required: true
        default: true
      - name: cover
        label: Cover Image
        type: image
      - name: canonical
        label: Canonical URL
        type: string
      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown
          rename: safe
          extensions: [png, jpg, jpeg, webp, avif]
